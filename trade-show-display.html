<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bajada New Energy</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2.5vh 3vw;
    }

    /* ── Logos ── */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      flex-shrink: 0;
    }
    .logo.top    { height: 8vh; }
    .logo.bottom { height: 7vh; }

    .logo img {
      height: 100%;
      max-width: 70vw;
      object-fit: contain;
    }

    .logo-text {
      font-family: Arial, sans-serif;
      font-size: clamp(12px, 2.8vh, 30px);
      font-weight: 700;
      color: #F26522;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    /* ── Centre stage ── */
    .center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dog {
      width: min(42vw, 62vh);
      height: auto;
      overflow: visible;
    }

    /* ── Blink animation ── */
    .eye-group {
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform;
    }

    @keyframes blink {
      0%, 86%, 100% { transform: scaleY(1); }
      90%           { transform: scaleY(0.07); }
      94%           { transform: scaleY(1); }
    }

    /* right eye lags ~55 ms for a natural feel */
    .eye-l { animation: blink 4.8s ease-in-out infinite; }
    .eye-r { animation: blink 4.8s ease-in-out infinite; animation-delay: 55ms; }

    /* ── Battery badge ── */
    #batt {
      position: fixed;
      top: 1.2vh;
      right: 1.5vw;
      display: flex;
      align-items: center;
      gap: 0.25em;
      padding: 0.4em 0.85em;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-size: clamp(10px, 1.6vh, 16px);
      font-weight: 600;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 999;
      line-height: 1;
    }

    #bolt { color: #F26522; display: none; }
    #bolt.on { display: inline; }
  </style>
</head>
<body>

  <!-- Battery badge (top-right, fixed) -->
  <div id="batt">
    <span id="bolt">&#9889;</span>
    <span id="pct">–</span>
  </div>

  <!-- Top logo: Bajada New Energy -->
  <div class="logo top">
    <img
      src="bne-logo.png"
      alt="Bajada New Energy"
      onerror="this.replaceWith(Object.assign(document.createElement('span'), {className: 'logo-text', textContent: 'Bajada New Energy'}))"
    >
  </div>

  <!-- Dog face: eyes + nose only, no outline -->
  <div class="center">
    <svg class="dog" viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

      <!-- Left eye -->
      <g class="eye-group eye-l">
        <ellipse cx="95"  cy="76" rx="34" ry="43" fill="#ffffff"/>
        <ellipse cx="98"  cy="82" rx="15" ry="20" fill="#111111"/>
        <ellipse cx="89"  cy="67" rx="7"  ry="6"  fill="#ffffff" opacity="0.65"/>
      </g>

      <!-- Right eye (mirrors left, 55 ms blink lag) -->
      <g class="eye-group eye-r">
        <ellipse cx="225" cy="76" rx="34" ry="43" fill="#ffffff"/>
        <ellipse cx="228" cy="82" rx="15" ry="20" fill="#111111"/>
        <ellipse cx="219" cy="67" rx="7"  ry="6"  fill="#ffffff" opacity="0.65"/>
      </g>

      <!-- Nose: wide rounded ellipse in BNE orange -->
      <ellipse cx="160" cy="155" rx="27" ry="17" fill="#F26522"/>
      <!-- Nose gloss highlight -->
      <ellipse cx="152" cy="147" rx="8"  ry="5"  fill="#FF9B60" opacity="0.45"/>

    </svg>
  </div>

  <!-- Bottom logo: Kingswell Innovation -->
  <div class="logo bottom">
    <img
      src="ki-logo.png"
      alt="Kingswell Innovation"
      onerror="this.replaceWith(Object.assign(document.createElement('span'), {className: 'logo-text', textContent: 'Kingswell Innovation'}))"
    >
  </div>

  <script>
    // Battery Status API — event-driven, no polling
    const pctEl  = document.getElementById('pct');
    const boltEl = document.getElementById('bolt');

    function render(b) {
      pctEl.textContent = Math.round(b.level * 100) + '%';
      boltEl.classList.toggle('on', b.charging);
    }

    if (navigator.getBattery) {
      navigator.getBattery()
        .then(b => {
          render(b);
          b.addEventListener('levelchange',    () => render(b));
          b.addEventListener('chargingchange', () => render(b));
        })
        .catch(() => { pctEl.textContent = 'N/A'; });
    } else {
      pctEl.textContent = 'N/A';
    }
  </script>

</body>
</html>
