<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bajada New Energy</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5vh 3vw;
    }

    /* ── Logos ── */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      flex-shrink: 0;
    }
    .logo.top    { height: 8vh; }
    .logo.bottom { height: 7vh; }

    .logo img {
      height: 100%;
      max-width: 70vw;
      object-fit: contain;
    }

    .logo-text {
      font-family: Arial, sans-serif;
      font-size: clamp(12px, 2.8vh, 30px);
      font-weight: 700;
      color: #F26522;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    /* ── Centre ── */
    .center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Main SVG (square — ring drives the aspect ratio) ── */
    .dog {
      width: min(90vw, 78vh);
      height: auto;
      overflow: visible;
    }

    /* ── Battery arc animates smoothly on level change ── */
    #battery-arc { transition: stroke-dashoffset 1.2s ease; }

    /* ── Eye blink ── */
    .eye-group {
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform;
    }

    @keyframes blink {
      0%, 86%, 100% { transform: scaleY(1); }
      90%           { transform: scaleY(0.07); }
      94%           { transform: scaleY(1); }
    }

    .eye-l { animation: blink 4.8s ease-in-out infinite; }
    .eye-r { animation: blink 4.8s ease-in-out infinite; animation-delay: 55ms; }

    /* ── Muzzle: color is set here, shape comes from nose.png mask ── */
    #muzzle-fill {
      fill: #2a2a2a;
      transition: fill 0.8s ease;
    }

    body.charging-active #muzzle {
      filter: url(#nose-glow);
      animation: nose-pulse 2.5s ease-in-out infinite;
    }

    body.charging-active #muzzle-fill { fill: #F26522; }

    @keyframes nose-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.38; }
    }

    /* ── Battery readout below the ring ── */
    .battery-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3em;
      flex-shrink: 0;
      padding: 0.5vh 0 1vh;
    }

    #pct-text {
      font-family: Arial, sans-serif;
      font-size: clamp(22px, 5.5vh, 52px);
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
    }

    #charge-label {
      font-family: Arial, sans-serif;
      font-size: clamp(9px, 1.5vh, 14px);
      font-weight: 600;
      letter-spacing: 0.18em;
      color: #F26522;
      opacity: 0;
      transition: opacity 0.9s ease;
    }

    body.charging-active #charge-label { opacity: 1; }
  </style>
</head>
<body>

  <!-- Top logo: Bajada New Energy -->
  <div class="logo top">
    <img
      src="bne-logo.png"
      alt="Bajada New Energy"
      onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-text',textContent:'Bajada New Energy'}))"
    >
  </div>

  <!-- ── Everything in one SVG: ring + ears + face + battery readout ── -->
  <div class="center">
    <svg id="face-svg" class="dog" viewBox="0 0 440 440"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

      <defs>
        <!-- Soft glow for muzzle when solar-charging -->
        <filter id="nose-glow" x="-70%" y="-70%" width="240%" height="240%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <!-- Shape mask: uses nose.png alpha channel directly -->
        <mask id="nose-mask" style="mask-type:alpha">
          <image href="nose.png" x="155" y="243" width="130" height="100"
                 preserveAspectRatio="xMidYMid meet"/>
        </mask>
      </defs>

      <!-- ── Battery ring ── -->
      <!-- Track (dim background circle) -->
      <circle cx="220" cy="220" r="200"
              fill="none"
              stroke="rgba(255,255,255,0.07)"
              stroke-width="10"/>

      <!-- Progress arc: starts at 12 o'clock, fills clockwise -->
      <!-- Circumference: 2π × 200 ≈ 1257 -->
      <circle id="battery-arc"
              cx="220" cy="220" r="200"
              fill="none"
              stroke="#F26522"
              stroke-width="10"
              stroke-linecap="round"
              stroke-dasharray="1257 1257"
              stroke-dashoffset="1257"
              transform="rotate(-90 220 220)"/>

      <!-- ── Eyes ── -->
      <g class="eye-group eye-l">
        <rect x="108" y="118" width="88" height="124" rx="44" fill="#ffffff"/>
      </g>

      <g class="eye-group eye-r">
        <rect x="244" y="118" width="88" height="124" rx="44" fill="#ffffff"/>
      </g>

      <!-- ── Muzzle: nose.png defines the shape; fill controls the colour ── -->
      <g id="muzzle">
        <rect id="muzzle-fill"
              x="155" y="243" width="130" height="100"
              mask="url(#nose-mask)"/>
      </g>

    </svg>
  </div>

  <!-- Battery readout: between ring and KI logo -->
  <div class="battery-info">
    <span id="pct-text">–%</span>
    <span id="charge-label">SOLAR CHARGING</span>
  </div>

  <!-- Bottom logo: Kingswell Innovation -->
  <div class="logo bottom">
    <img
      src="ki-logo.png"
      alt="Kingswell Innovation"
      onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-text',textContent:'Kingswell Innovation'}))"
    >
  </div>

  <script>
    const arc    = document.getElementById('battery-arc');
    const pctTxt = document.getElementById('pct-text');
    const CIRC   = 2 * Math.PI * 200; // ≈ 1257

    function render(b) {
      pctTxt.textContent = Math.round(b.level * 100) + '%';
      arc.style.strokeDashoffset = CIRC * (1 - b.level);
      document.body.classList.toggle('charging-active', b.charging);
    }

    // URL param override for localhost testing (ignored in production):
    //   ?battery=75&charging=true
    const p = new URLSearchParams(location.search);
    if (p.has('battery')) {
      render({ level: Math.min(100, Math.max(0, +p.get('battery'))) / 100,
               charging: p.get('charging') === 'true' });
    } else if (navigator.getBattery) {
      navigator.getBattery()
        .then(b => {
          render(b);
          b.addEventListener('levelchange',    () => render(b));
          b.addEventListener('chargingchange', () => render(b));
        })
        .catch(() => { pctTxt.textContent = 'N/A'; });
    } else {
      pctTxt.textContent = 'N/A';
    }
  </script>

</body>
</html>
